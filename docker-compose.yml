version: '3.8'
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - db-network

  oracle:
    image: gvenzl/oracle-free:23.6-slim-faststart
    environment:
      - ORACLE_PASSWORD=YourStrong@Passw0rd
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - db-network

networks:
  db-network:
    driver: bridge

volumes:
  mssql-data:
  oracle-data: